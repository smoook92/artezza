<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Skeleton Loading — тест компонента</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <style>
        body {
            min-height: 100vh;
            padding: 48px 24px;
            color: var(--color-text);
            background: var(--color-background);
            font-family: var(--font-primary);
        }

        .skeleton-test {
            width: min(100%, 1100px);
            margin-inline: auto;
        }

        .skeleton-test__header {
            margin-bottom: 32px;
        }

        .skeleton-test__controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 32px;
        }

        .skeleton-test__controls button {
            padding: 12px 18px;
            color: var(--color-text-light);
            background: var(--color-primary);
            border: 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
        }

        .skeleton-test__controls button:hover {
            background: var(--color-primary-hover);
        }

        .skeleton-test__result {
            min-height: 180px;
        }

        .skeleton-test__status {
            min-height: 24px;
            margin-top: 20px;
            color: var(--color-text-muted);
            font-size: var(--font-size-sm);
        }

        @media (max-width: 600px) {
            body {
                padding: 28px 16px;
            }
        }
    </style>
</head>
<body>
    <main class="skeleton-test">
        <header class="skeleton-test__header">
            <h1>Skeleton Loading</h1>
            <p>Тест универсального компонента. Выберите тип placeholder.</p>
        </header>

        <div class="skeleton-test__controls" aria-label="Тип Skeleton">
            <button type="button" data-skeleton-type="product-card">Карточки товаров</button>
            <button type="button" data-skeleton-type="portfolio-card">Карточки проектов</button>
            <button type="button" data-skeleton-type="review-card">Отзывы</button>
            <button type="button" data-skeleton-type="image">Изображение</button>
            <button type="button" data-skeleton-type="text">Текст</button>
            <button type="button" data-skeleton-hide>Скрыть Skeleton</button>
        </div>

        <section
            class="skeleton-test__result"
            id="skeleton-preview"
            aria-label="Предпросмотр Skeleton"
            aria-busy="false"
        ></section>

        <p class="skeleton-test__status" id="skeleton-status" role="status">
            Выберите тип для предпросмотра.
        </p>
    </main>

    <script type="module" src="assets/js/pages/skeleton-test.js"></script>
</body>
</html>
